name: Go CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.23

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -mod=mod -coverprofile=c.out -failfast -timeout 5m ./...

    - name: Build application
      run: go build -mod=mod -o /auditlog cmd/serverd/main.go

  fake_deploy:
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
    - name: Fake deploy
      run: |
        echo "Starting fake deploy..."
        sleep 10
        echo "Fake deploy completed." 
